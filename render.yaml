services:
  - type: web
    name: folio-server
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Set these as secret env vars in the Render dashboard:
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RECOVERY_EMAIL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Set this to your Vercel frontend URL, e.g. https://your-app.vercel.app
      - key: CLIENT_URL
        sync: false
      # SMTP settings for forgot-password email delivery
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      # Traccar telemetry integration (optional)
      - key: TRACCAR_BASE_URL
        sync: false
      - key: TRACCAR_USERNAME
        sync: false
      - key: TRACCAR_PASSWORD
        sync: false
      - key: TRACCAR_SESSION_PATH
        sync: false
      - key: TRACCAR_TIMEOUT_MS
        sync: false
